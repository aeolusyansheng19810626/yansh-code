[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "yansh-code"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "tree-sitter>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "ddgs>=7.0.0",
    "prompt_toolkit>=3.0.0",
    "pathspec>=0.11.0",
    "Pillow>=10.0.0",
    "psutil>=5.9.0",
]

[project.scripts]
yansh = "main:main"

[tool.setuptools]
py-modules = [
    "main", "agent", "tools", "config", "monitor", "interrupt",
    "snapshot", "hil", "task_log", "linter", "llm_client", "tools_schema",
    # P1-P4 新增模块（遗漏会导致 pip install 的 yansh 启动 ModuleNotFoundError）
    "state", "sandbox",
    "skills",
    "mcp_client",
    "hooks", "procutil", "workspace_trust",
    "memory",
    "frontmatter", "subagent",
    "console_shared",
]
