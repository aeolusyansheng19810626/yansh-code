[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "yansh-code"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "tree-sitter>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "ddgs>=7.0.0",
    "prompt_toolkit>=3.0.0",
    "pathspec>=0.11.0",
    "Pillow>=10.0.0",
]

[project.scripts]
yansh = "main:main"

[tool.setuptools]
py-modules = ["main", "agent", "tools", "config", "monitor", "interrupt", "snapshot", "hil", "task_log", "linter", "llm_client", "tools_schema"]
